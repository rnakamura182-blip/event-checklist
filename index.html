<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>屋台 持ち物・在庫チェック</title>
<style>
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5d6877;
  --line: #d3dae3;
  --accent: #1f3a5f;
  --accent-ink: #ffffff;
  --ok: #2f7d4f;
  --ok-soft: #e1f0e6;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --danger: #b3261e;
  --danger-soft: #fbe3e1;
  --field: #f6f8fb;
  --shade: rgba(15, 23, 32, .45);
}
:root[data-mode="event"] { --accent: #b45309; --bg: #f7f0e6; }
:root[data-mode="daily"] { --accent: #1f3a5f; --bg: #eaf0f7; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161d;
    --surface: #1a212b;
    --ink: #e7ecf2;
    --muted: #9aa6b5;
    --line: #2c3643;
    --accent: #8fb3e0;
    --accent-ink: #0f1720;
    --ok: #6cc494;
    --ok-soft: #1c3226;
    --warn: #e8b25c;
    --warn-soft: #3a2c14;
    --danger: #f08a82;
    --danger-soft: #3b1f1d;
    --field: #232c38;
    --shade: rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- ヘッダー（スクロールしても残る） ---- */
.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
}
.top-row { display: flex; align-items: center; gap: 8px; }
.tabs { display: flex; flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.tab {
  flex: 1; height: 38px; border: 0; border-radius: 9px; background: none; font-weight: 700; font-size: 16px; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
@media (prefers-color-scheme: dark) {
  :root[data-mode="event"] { --accent: #f0a85c; --bg: #1d1710; }
  :root[data-mode="daily"] { --accent: #8fb3e0; --bg: #11161d; }
}
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync[data-kind="busy"]::before { background: var(--warn); }
.sync[data-kind="error"] { color: var(--danger); font-weight: 700; }
.sync[data-kind="error"]::before { background: var(--danger); }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 20px; height: 20px; }
.progress { margin-top: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.progress b { font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
.short-count { color: var(--danger); font-weight: 700; white-space: nowrap; }
.filters { margin-top: 8px; display: flex; gap: 6px; }
.filters select {
  flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 0 8px; font-size: 16px;
}
.chip {
  flex: none; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); white-space: nowrap; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

.wrap { max-width: 640px; margin: 0 auto; padding: 8px 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
.search {
  width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 0 12px; font-size: 16px; margin: 4px 0 2px;
}
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 14px; }

/* ---- カテゴリと品目 ---- */
.cat { margin-top: 14px; }
.cat h2 {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 14px; margin: 0 2px 6px; color: var(--accent); letter-spacing: .03em;
}
.cat-count { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-count.full { color: var(--ok); font-weight: 700; }
.cat h2 { font-size: 15px; }
.cat h3.sub {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 13px; margin: 10px 4px 5px; color: var(--muted); font-weight: 700;
  padding-left: 8px; border-left: 3px solid var(--line);
}
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 10px 10px; transition: opacity .2s, background .2s, box-shadow .4s;
}
.item.done { background: var(--ok-soft); border-color: transparent; }
.item.gone { opacity: .45; }
.item.flash { box-shadow: 0 0 0 3px var(--accent); }
.top-line { display: flex; align-items: center; gap: 10px; }
.check {
  flex: none; width: 48px; height: 48px; margin: -4px 0 -4px -6px; border: 0; background: none; padding: 0;
  display: grid; place-items: center;
}
.check .box {
  width: 30px; height: 30px; border-radius: 8px; border: 2.5px solid var(--muted);
  display: grid; place-items: center; background: var(--surface);
}
.check svg { width: 18px; height: 18px; opacity: 0; }
.item.done .check .box { background: var(--ok); border-color: var(--ok); }
.item.done .check svg { opacity: 1; }
.info { min-width: 0; flex: 1; }
.name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.35; }
.item.done .name { color: var(--muted); text-decoration: line-through; }
.memo { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.memo.warn { color: var(--warn); font-weight: 700; }
.nums { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr 64px; gap: 8px; align-items: end; }
.nums .num.reorder { grid-column: 1 / 3; }
.nums .num.reorder .numin.solo { width: 100%; }
.lbl { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; text-align: center; letter-spacing: .06em; }
.stepper { display: flex; align-items: stretch; height: 44px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--field); }
.step { flex: none; width: 40px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--accent); }
.step:active { background: var(--line); }
.numin {
  flex: 1; min-width: 0; width: 100%; border: 0; border-inline: 1px solid var(--line);
  background: var(--surface); text-align: center; font-size: 16px; font-weight: 700;
  font-variant-numeric: tabular-nums; border-radius: 0; padding: 0 2px;
}
.numin.solo { height: 44px; border: 1px solid var(--line); border-radius: 10px; font-weight: 400; }
.left, .state { text-align: center; }
.left .val { display: block; height: 44px; line-height: 44px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.left.neg .val { color: var(--danger); }
.left.neg .lbl { color: var(--danger); font-weight: 700; }
.state .val { display: grid; place-items: center; height: 44px; font-size: 14px; font-weight: 700; color: var(--muted); }
.state.short .val { color: var(--danger); }
.state.short .val span { background: var(--danger-soft); border-radius: 8px; padding: 4px 8px; }
.state.ok .val { color: var(--ok); }

/* ---- 下のボタン ---- */
.actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.wide {
  width: 100%; height: 50px; border-radius: 12px; font-weight: 700; font-size: 16px;
  border: 1px solid var(--line); background: var(--surface);
}
.wide.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wide.danger { color: var(--danger); border-color: var(--danger); background: transparent; }

/* ---- 状態表示 ---- */
.panel { max-width: 420px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top, 0px)) 20px 40px; }
.panel h1 { font-size: 22px; margin: 0 0 16px; color: var(--accent); }
.panel p { margin: 8px 0; }
.panel .detail { font-size: 12px; color: var(--muted); word-break: break-all; }
.field {
  width: 100%; height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 0 14px; font-size: 18px; margin: 6px 0 12px;
}
.primary-btn {
  width: 100%; height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px;
}
.err { color: var(--danger); font-weight: 700; min-height: 1.5em; margin: 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
.foot { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; font-size: 12px; padding: 8px; }
.toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: 420px; margin: 0 auto; padding: 12px 14px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}

/* ---- 品目の追加 ---- */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
.sheet h2 { margin: 0 0 12px; font-size: 18px; color: var(--accent); }
.sheet label { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 10px; }
.sheet .field { height: 48px; font-size: 16px; margin: 4px 0 0; }
.seg { display: flex; gap: 6px; margin-top: 4px; }
.seg button { flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
.sheet-actions button { flex: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- パスワードの入力 -->
<main id="loginView" class="panel" hidden>
  <h1>屋台 持ち物・在庫チェック</h1>
  <p>パスワードを入力してください。</p>
  <form id="loginForm" autocomplete="off">
    <input id="keyInput" class="field" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="パスワード" placeholder="パスワード">
    <p id="loginMsg" class="err" role="alert"></p>
    <button class="primary-btn" type="submit">開く</button>
  </form>
</main>

<!-- 読み込み中・エラー -->
<main id="statusView" class="panel" hidden>
  <h1>屋台 持ち物・在庫チェック</h1>
  <p id="statusMsg" role="status">読み込み中…</p>
  <p id="statusDetail" class="detail"></p>
  <button id="retryBtn" class="primary-btn" type="button" hidden>もう一度読み込む</button>
</main>

<!-- チェックリスト -->
<div id="mainView" hidden>
  <header class="top">
    <div class="top-row">
      <div class="tabs" role="tablist" aria-label="表示する品目">
        <button id="tabDaily" class="tab" type="button" role="tab" aria-selected="true">普段</button>
        <button id="tabEvent" class="tab" type="button" role="tab" aria-selected="false">イベント</button>
      </div>
      <span id="sync" class="sync" data-kind="ok" role="status"></span>
      <button id="addBtn" class="icon-btn" type="button" aria-label="品目を追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="reloadBtn" class="icon-btn" type="button" aria-label="最新の状態に更新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="progress">
      <span>チェック <b id="progressText">0 / 0</b></span>
      <div class="bar"><i id="barFill"></i></div>
      <span id="shortCount" class="short-count" hidden></span>
    </div>
    <div class="filters">
      <select id="catSelect" aria-label="カテゴリで絞り込み"><option value="">すべてのカテゴリ</option></select>
      <button id="todoBtn" class="chip" type="button" aria-pressed="false">未チェック</button>
      <button id="shortBtn" class="chip" type="button" aria-pressed="false" hidden>不足だけ</button>
    </div>
  </header>
  <div class="wrap">
    <input id="search" class="search" type="search" placeholder="品目名で探す" aria-label="品目名で探す" autocomplete="off">
    <p id="v2Notice" class="notice" hidden>普段用の列がまだシートにありません。シートのメニュー「チェックリスト → ③ 普段用の列を追加」を実行すると使えるようになります。</p>
    <div id="list" data-mode="event"></div>
    <p id="empty" class="empty" hidden>条件に合う品目がありません。</p>
    <div class="actions">
      <button id="addBtn2" class="wide primary" type="button">＋ 品目を追加</button>
      <button id="resetBtn" class="wide danger" type="button">イベントのチェックを全部外す</button>
    </div>
    <div class="foot">
      <div id="footInfo"></div>
      <button id="relogin" class="link" type="button">パスワードを入れ直す</button>
    </div>
  </div>
</div>

<!-- 品目の追加 -->
<div id="addPanel" class="overlay" hidden>
  <form id="addForm" class="sheet" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <h2 id="addTitle">品目を追加</h2>
    <label for="addName">品目名</label>
    <input id="addName" class="field" type="text" maxlength="40" placeholder="例: 割り箸">
    <label for="addCat">カテゴリ</label>
    <select id="addCat" class="field"></select>
    <input id="addCatNew" class="field" type="text" maxlength="30" placeholder="例: ラーメン／食材" aria-label="新しいカテゴリ名" hidden>
    <p id="addCatHint" class="hint" hidden>「大分類／小分類」と書くと2段になります（例: ラーメン／食材）。「／」なしなら1段です。</p>
    <label>どの画面に出すか</label>
    <div class="seg" id="addUse">
      <button type="button" data-use="イベント" aria-pressed="false">イベント</button>
      <button type="button" data-use="普段" aria-pressed="false">普段</button>
      <button type="button" data-use="両方" aria-pressed="false">両方</button>
    </div>
    <p id="useHint" class="hint"></p>
    <div id="addReorderWrap">
      <label for="addReorder">発注点（任意。この数を下回ったら「不足」と表示）</label>
      <input id="addReorder" class="field" type="text" inputmode="decimal" placeholder="例: 5">
    </div>
    <p id="addErr" class="err" role="alert"></p>
    <div class="sheet-actions">
      <button id="addCancel" class="wide" type="button">やめる</button>
      <button id="addSubmit" class="wide primary" type="submit">追加する</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<template id="itemTpl">
  <li class="item">
    <div class="top-line">
      <button type="button" class="check" role="checkbox" aria-checked="false">
        <span class="box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <div class="info">
        <div class="name"></div>
        <div class="memo"></div>
      </div>
    </div>
    <div class="nums">
      <div class="num" data-field="stock">
        <span class="lbl">在庫</span>
        <div class="stepper">
          <button type="button" class="step" data-d="-1">−</button>
          <input class="numin" type="text" inputmode="decimal" autocomplete="off">
          <button type="button" class="step" data-d="1">＋</button>
        </div>
      </div>
      <div class="num" data-field="used">
        <span class="lbl">使用</span>
        <div class="stepper">
          <button type="button" class="step" data-d="-1">−</button>
          <input class="numin" type="text" inputmode="decimal" autocomplete="off">
          <button type="button" class="step" data-d="1">＋</button>
        </div>
      </div>
      <div class="left"><span class="lbl">残り</span><span class="val"></span></div>
      <div class="num reorder" data-field="reorder">
        <span class="lbl">発注点</span>
        <input class="numin solo" type="text" inputmode="decimal" autocomplete="off">
      </div>
      <div class="state"><span class="lbl">状態</span><span class="val"></span></div>
    </div>
  </li>
</template>

<script>
(() => {
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbz1IeUw4AZntCm9v-qDYkG7P0PfPopEtN_kzAKCZ4BAMSDCyuLUyLB1JEgc4MJQvHpB6Q/exec';
const APP_VERSION = '2026-10-17f'; // 画面ファイルを更新したら変える（スマホに新しい版が届いたかの確認用）
const KEY_STORAGE = 'event_checklist_key';
const MODE_STORAGE = 'event_checklist_mode';
const JSONP_FIRST_STORAGE = 'event_checklist_jsonp_first'; // fetch で止まった端末は次回から JSONP を先に使う
const POLL_MS = 20000;
const FETCH_TIMEOUT_MS = 15000;
const JSONP_TIMEOUT_MS = 20000;
const MODE_LABEL = { event: 'イベント', daily: '普段' };
const USE_HINT = { 'イベント': 'イベントの画面にだけ出ます。', '普段': '普段の画面にだけ出ます。', '両方': 'イベントと普段の両方の画面に出ます（チェックは別々）。' };

const $ = (id) => document.getElementById(id);
const state = {
  items: [], rowMap: new Map(), key: '', layout: 'v3', fetchedAt: null, serverVersion: '', sig: '',
  mode: 'daily', cat: '', onlyTodo: false, onlyShort: false, query: ''
};
const rowState = new Map(); // row -> { busy, queue: [] }  同じ品目への操作は順番に1つずつ送る
let pendingTotal = 0;
let loading = false;

function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない端末でも毎回入力すれば使える */ } }
function storageDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
const round6 = (n) => Math.round(n * 1e6) / 1e6;
const norm = (s) => String(s).normalize('NFKC').toLowerCase();

// ---------- 表示の切り替え ----------
function show(id) { ['loginView', 'statusView', 'mainView'].forEach((v) => { $(v).hidden = v !== id; }); }
function status(msg, detail, retry) {
  $('statusMsg').textContent = msg;
  $('statusDetail').textContent = detail || '';
  $('retryBtn').hidden = !retry;
  show('statusView');
}
function showLogin(msg) { $('loginMsg').textContent = msg || ''; $('keyInput').value = ''; closeAdd(); show('loginView'); }
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
function setSync(kind) {
  const s = $('sync');
  s.dataset.kind = kind;
  if (kind === 'busy') s.textContent = '送信中';
  else if (kind === 'error') s.textContent = '通信エラー';
  else s.textContent = state.fetchedAt ? state.fetchedAt.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
  s.title = kind === 'ok' ? '最終同期' : '';
}

// ---------- 通信 ----------
// 1) fetch は15秒で打ち切る 2) fetch が失敗・停止したら JSONP（<script>読み込み）で取り直す（iPhoneで fetch が止まる端末の対策）
// 3) 在庫・使用の増減(adj)と品目の追加(add)は、自動では取り直さない（増減は二重に効くため。追加は念のため）
let cbSeq = 0;
function buildUrl(params) {
  const q = new URLSearchParams();
  Object.keys(params).forEach((k) => q.set(k, String(params[k])));
  q.set('key', state.key);
  q.set('t', String(Date.now()));
  return API_URL + '?' + q.toString();
}
function viaFetch(url) {
  return new Promise((resolve, reject) => {
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctrl) ctrl.abort(); reject(new Error('fetch timeout ' + FETCH_TIMEOUT_MS / 1000 + 's')); }, FETCH_TIMEOUT_MS);
    fetch(url, { method: 'GET', credentials: 'omit', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then((res) => res.text().then((text) => {
        try { return JSON.parse(text); }
        catch (e) { throw new Error('fetch: JSONではない応答 (HTTP ' + res.status + ')'); }
      }))
      .then((data) => { clearTimeout(timer); resolve(data); })
      .catch((e) => { clearTimeout(timer); reject(new Error('fetch: ' + (e && (e.name + ' ' + e.message)))); });
  });
}
function viaJsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '__ecCb' + Date.now() + '_' + (++cbSeq);
    const script = document.createElement('script');
    const cleanup = () => { clearTimeout(timer); delete window[cb]; script.remove(); };
    const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp timeout ' + JSONP_TIMEOUT_MS / 1000 + 's')); }, JSONP_TIMEOUT_MS);
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('jsonp: 読み込み失敗')); };
    script.src = url + '&callback=' + cb;
    document.head.appendChild(script);
  });
}
const netError = (detail) => ({ kind: 'network', message: '通信できませんでした。電波の状態を確認してください。', detail });
const apiError = (data) => ({ kind: (data && data.error) || 'server_error', message: (data && data.message) || 'エラーが発生しました。' });

async function request(params, idempotent) {
  const url = buildUrl(params);
  const jsonpFirst = storageGet(JSONP_FIRST_STORAGE) === '1';
  const order = jsonpFirst ? [viaJsonp, viaFetch] : [viaFetch, viaJsonp];
  let data;
  try {
    data = await order[0](url);
  } catch (e1) {
    if (!idempotent) throw netError(e1.message);
    try {
      data = await order[1](url);
      if (jsonpFirst) storageDel(JSONP_FIRST_STORAGE); else storageSet(JSONP_FIRST_STORAGE, '1');
    } catch (e2) {
      throw netError(e1.message + ' / ' + e2.message);
    }
  }
  if (!data || data.ok !== true) throw apiError(data);
  return data;
}

// ---------- 読み込み ----------
async function load(opts) {
  opts = opts || {};
  if (loading) return;
  loading = true;
  if (!state.items.length) status('読み込み中…');
  setSync('busy');
  try {
    const data = await request({ action: 'list' }, true);
    state.serverVersion = data.version || '';
    state.layout = data.layout || 'v2';
    state.fetchedAt = new Date(data.fetchedAt);
    applyList(data.items, !!opts.rebuild);
    show('mainView');
    if (pendingTotal === 0) setSync('ok');
  } catch (err) {
    onLoadError(err);
  } finally {
    loading = false;
  }
}

function onLoadError(err) {
  if (err.kind === 'unauthorized') {
    storageDel(KEY_STORAGE); state.key = '';
    showLogin(err.message);
  } else if (state.items.length) {
    setSync('error');
    toast(err.message);
  } else {
    status(err.message, err.detail ? '詳細: ' + err.detail + '（画面 ' + APP_VERSION + '）' : '（画面 ' + APP_VERSION + '）', true);
  }
}

function applyList(serverItems, rebuild) {
  // 操作中の品目は、手元の値を優先する（古いサーバーの値で上書きして数字が戻るのを防ぐ）
  const merged = serverItems.map((it) => (rowState.has(it.row) && state.rowMap.has(it.row) ? state.rowMap.get(it.row) : it));
  state.items = merged;
  state.rowMap = new Map(merged.map((i) => [i.row, i]));
  render(rebuild);
}

// ---------- 表示 ----------
const inMode = (it) => (state.mode === 'daily' ? it.use === '普段' || it.use === '両方' : it.use !== '普段');
const isDone = (it) => (state.mode === 'daily' ? !!it.daily : !!it.checked);
const calcLeft = (it) => (it.stock === null && it.used === null ? null : round6((it.stock || 0) - (it.used || 0)));
const isShort = (it) => it.stock !== null && it.stock !== undefined && it.reorder !== null && it.reorder !== undefined && round6(it.stock - (it.used || 0)) < it.reorder;
const fmt = (n) => String(n);

// カテゴリ「大分類／小分類」を分ける（「／」「/」どちらでも）。区切りが無ければ小分類は空（シート側 splitCategory_ と同じ）
function splitCat(cat) {
  const s = String(cat === undefined || cat === null ? '' : cat).trim();
  const m = s.match(/^(.*?)\s*[／/]\s*(.*)$/);
  return m ? { major: m[1].trim(), minor: m[2].trim() } : { major: s, minor: '' };
}
// 大分類 → その中のカテゴリ（出てきた順）
function groupCats(items) {
  const majors = [];
  const byMajor = new Map();
  items.forEach((i) => {
    const major = splitCat(i.cat).major;
    if (!byMajor.has(major)) { byMajor.set(major, []); majors.push(major); }
    const cats = byMajor.get(major);
    if (!cats.includes(i.cat)) cats.push(i.cat);
  });
  return majors.map((major) => ({ major, cats: byMajor.get(major) }));
}
const isTwoLevel = (group) => group.cats.some((c) => splitCat(c).minor !== '');
// 絞り込みの値: '' = すべて、'M:大分類' = その大分類すべて、'C:カテゴリ' = そのカテゴリだけ
function catFilterOk(it) {
  if (!state.cat) return true;
  if (state.cat.startsWith('M:')) return splitCat(it.cat).major === state.cat.slice(2);
  return it.cat === state.cat.slice(2);
}

function matches(it) {
  if (!inMode(it)) return false;
  if (!catFilterOk(it)) return false;
  if (state.onlyTodo && isDone(it)) return false;
  if (state.onlyShort && !isShort(it)) return false;
  if (state.query && !norm(it.name).includes(norm(state.query))) return false;
  return true;
}

function currentSig() {
  return state.items.map((i) => i.row + '|' + i.cat + '|' + i.name + '|' + i.use).join('\n') +
    '#' + [state.mode, state.layout, state.cat, state.onlyTodo, state.onlyShort, state.query].join('#');
}

function render(force) {
  if (force || currentSig() !== state.sig) rebuild(); else state.items.forEach(refreshItem);
  updateHeader();
}

function categoriesOf(items) {
  const cats = [];
  items.forEach((i) => { if (!cats.includes(i.cat)) cats.push(i.cat); });
  return cats;
}

function updateCatSelect(groups) {
  const sel = $('catSelect');
  sel.textContent = '';
  const values = [''];
  const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.append(o); values.push(value); };
  sel.append(Object.assign(document.createElement('option'), { value: '', textContent: 'すべてのカテゴリ' }));
  groups.forEach((g) => {
    if (isTwoLevel(g)) {
      add('M:' + g.major, (g.major || '（カテゴリなし）') + '（すべて）');
      g.cats.forEach((c) => add('C:' + c, '　└ ' + (splitCat(c).minor || '（小分類なし）')));
    } else {
      g.cats.forEach((c) => add('C:' + c, c || '（カテゴリなし）'));
    }
  });
  if (!values.includes(state.cat)) state.cat = '';
  sel.value = state.cat;
}

function makeHeading(tag, cls, text, scope) {
  const h = document.createElement(tag);
  if (cls) h.className = cls;
  const nameEl = document.createElement('span'); nameEl.textContent = text;
  const cnt = document.createElement('span'); cnt.className = 'cat-count';
  Object.assign(cnt.dataset, scope);
  h.append(nameEl, cnt);
  return h;
}

function rebuild() {
  const daily = state.mode === 'daily';
  const v2Daily = daily && state.layout !== 'v3';
  $('v2Notice').hidden = !v2Daily;
  const list = $('list');
  list.dataset.mode = state.mode;
  const modeItems = v2Daily ? [] : state.items.filter(inMode);
  const groups = groupCats(modeItems);
  updateCatSelect(groups);
  const frag = document.createDocumentFragment();
  groups.forEach((g) => {
    // 2段のカテゴリ（大分類／小分類）は大分類の見出しの下に小見出しを並べる。1段のカテゴリは見出し1つだけ。
    const two = isTwoLevel(g);
    const blocks = g.cats
      .map((cat) => ({ cat, shown: modeItems.filter((i) => i.cat === cat && matches(i)) }))
      .filter((b) => b.shown.length);
    if (!blocks.length) return;
    const sec = document.createElement('section'); sec.className = 'cat'; sec.dataset.major = g.major;
    sec.append(makeHeading('h2', '', g.major || '（カテゴリなし）', { major: g.major }));
    blocks.forEach((b) => {
      if (two) sec.append(makeHeading('h3', 'sub', splitCat(b.cat).minor || '（小分類なし）', { cat: b.cat }));
      const ul = document.createElement('ul'); ul.className = 'items';
      b.shown.forEach((it) => ul.append(makeItemEl(it)));
      sec.append(ul);
    });
    frag.append(sec);
  });
  list.textContent = '';
  list.append(frag);
  $('empty').hidden = v2Daily || list.children.length > 0;
  state.sig = currentSig();
  updateCatCounts();
}

function makeItemEl(it) {
  const li = $('itemTpl').content.firstElementChild.cloneNode(true);
  li.dataset.row = it.row;
  li.querySelector('.check').setAttribute('aria-label', it.name + ' を' + MODE_LABEL[state.mode] + 'でチェック');
  li.querySelectorAll('.num').forEach((n) => {
    const label = n.querySelector('.lbl').textContent;
    n.querySelector('.numin').setAttribute('aria-label', it.name + ' の' + label);
    n.querySelectorAll('.step').forEach((b) => b.setAttribute('aria-label', it.name + ' の' + label + 'を' + (Number(b.dataset.d) > 0 ? '1増やす' : '1減らす')));
  });
  patchItemEl(li, it);
  return li;
}

function patchItemEl(li, it) {
  const done = isDone(it);
  li.classList.toggle('done', done);
  li.classList.toggle('gone', !matches(it));
  li.querySelector('.check').setAttribute('aria-checked', String(done));
  li.querySelector('.name').textContent = it.name;
  const memo = li.querySelector('.memo');
  memo.textContent = it.memo || '';
  memo.hidden = !it.memo;
  memo.classList.toggle('warn', /要確認/.test(it.memo || ''));
  li.querySelectorAll('.num').forEach((n) => {
    const inp = n.querySelector('.numin');
    const v = it[n.dataset.field];
    if (document.activeElement !== inp) inp.value = v === null || v === undefined ? '' : fmt(v);
  });
  const left = calcLeft(it);
  li.querySelector('.left .val').textContent = left === null ? '–' : fmt(left);
  li.querySelector('.left').classList.toggle('neg', left !== null && left < 0);
  const st = li.querySelector('.state');
  const short = isShort(it);
  const known = it.stock !== null && it.stock !== undefined && it.reorder !== null && it.reorder !== undefined;
  st.classList.toggle('short', short);
  st.classList.toggle('ok', known && !short);
  const val = st.querySelector('.val');
  val.textContent = '';
  const span = document.createElement('span');
  span.textContent = short ? '不足' : (known ? 'OK' : '–');
  val.append(span);
}

function refreshItem(it) {
  const li = $('list').querySelector('[data-row="' + it.row + '"]');
  if (li) patchItemEl(li, it);
  updateHeader();
  updateCatCounts();
}

function updateHeader() {
  const daily = state.mode === 'daily';
  const modeItems = daily && state.layout !== 'v3' ? [] : state.items.filter(inMode);
  const done = modeItems.filter(isDone).length;
  $('progressText').textContent = done + ' / ' + modeItems.length;
  $('barFill').style.width = modeItems.length ? (done / modeItems.length * 100) + '%' : '0';
  const shortN = modeItems.filter(isShort).length;
  document.documentElement.dataset.mode = state.mode;
  $('shortCount').hidden = shortN === 0;
  $('shortCount').textContent = '不足 ' + shortN;
  $('tabEvent').setAttribute('aria-selected', String(!daily));
  $('tabDaily').setAttribute('aria-selected', String(daily));
  $('todoBtn').setAttribute('aria-pressed', String(state.onlyTodo));
  $('shortBtn').hidden = false;
  $('shortBtn').setAttribute('aria-pressed', String(state.onlyShort));
  $('resetBtn').textContent = MODE_LABEL[state.mode] + 'のチェックを全部外す';
  $('resetBtn').disabled = daily && state.layout !== 'v3';
  $('footInfo').textContent = '画面 ' + APP_VERSION + (state.serverVersion ? ' / サーバー ' + state.serverVersion : '');
}

function updateCatCounts() {
  $('list').querySelectorAll('.cat-count').forEach((cnt) => {
    const group = state.items.filter((i) => inMode(i) &&
      ('cat' in cnt.dataset ? i.cat === cnt.dataset.cat : splitCat(i.cat).major === cnt.dataset.major));
    const done = group.filter(isDone).length;
    cnt.textContent = done + ' / ' + group.length;
    cnt.classList.toggle('full', group.length > 0 && done === group.length);
  });
}

function setMode(mode) {
  if (state.mode === mode) return;
  state.mode = mode;
  state.onlyShort = false;
  storageSet(MODE_STORAGE, mode);
  render(true);
  window.scrollTo(0, 0);
}

// ---------- 操作 ----------
function parseNum(text) {
  const t = String(text).normalize('NFKC').replace(/[,\s]/g, '');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return undefined;
  const n = Number(t);
  return isFinite(n) && n <= 1e9 ? n : undefined;
}

function onToggle(it) {
  if (state.mode === 'daily') {
    it.daily = !it.daily;
    refreshItem(it);
    enqueue(it, { type: 'check', mode: 'daily', value: it.daily });
  } else {
    it.checked = !it.checked;
    refreshItem(it);
    enqueue(it, { type: 'check', mode: 'event', value: it.checked });
  }
}
function onAdjust(it, field, d) {
  const cur = it[field];
  if (cur === null && d < 0) return;
  it[field] = Math.max(0, round6((cur || 0) + d));
  refreshItem(it);
  enqueue(it, { type: 'adj', field, delta: d });
}
function onPut(it, field, text) {
  const parsed = parseNum(text);
  if (parsed === undefined) {
    toast('0以上の数字で入力してください。');
    refreshItem(it);
    return;
  }
  if (parsed === it[field]) { refreshItem(it); return; }
  it[field] = parsed;
  refreshItem(it);
  enqueue(it, { type: 'put', field, value: parsed === null ? '' : parsed });
}

function enqueue(it, op) {
  let rs = rowState.get(it.row);
  if (!rs) { rs = { busy: false, queue: [] }; rowState.set(it.row, rs); }
  rs.queue.push(op);
  pendingTotal++;
  setSync('busy');
  pump(it.row);
}

async function pump(row) {
  const rs = rowState.get(row);
  if (!rs || rs.busy || !rs.queue.length) return;
  rs.busy = true;
  const op = rs.queue.shift();
  let consumed = 1;
  if (op.type === 'adj') {
    // 連打した増減は1回にまとめて送る
    while (rs.queue.length && rs.queue[0].type === 'adj' && rs.queue[0].field === op.field) {
      op.delta += rs.queue.shift().delta;
      consumed++;
    }
  }
  const it = state.rowMap.get(row);
  const base = { row, name: it ? it.name : '' };
  try {
    let data;
    if (op.type === 'check') data = await request(Object.assign({ action: 'check', mode: op.mode, value: op.value ? '1' : '0' }, base), true);
    else if (op.type === 'put') data = await request(Object.assign({ action: 'put', field: op.field, value: op.value }, base), true);
    else data = await request(Object.assign({ action: 'adj', field: op.field, delta: op.delta }, base), false);
    pendingTotal -= consumed;
    rs.busy = false;
    if (rs.queue.length) {
      pump(row);
    } else {
      rowState.delete(row);
      applyServerItem(data.item);
    }
    if (pendingTotal === 0) { state.fetchedAt = new Date(); setSync('ok'); }
  } catch (err) {
    pendingTotal -= consumed + rs.queue.length;
    rs.queue.length = 0;
    rs.busy = false;
    rowState.delete(row);
    onWriteError(err);
  }
}

function applyServerItem(item) {
  const cur = state.rowMap.get(item.row);
  if (!cur || cur.name !== item.name) return;
  const idx = state.items.indexOf(cur);
  state.items[idx] = item;
  state.rowMap.set(item.row, item);
  refreshItem(item);
}

function onWriteError(err) {
  if (err.kind === 'unauthorized') {
    storageDel(KEY_STORAGE); state.key = '';
    showLogin(err.message);
    return;
  }
  if (err.kind === 'network') toast('通信が不安定です。念のため画面の数字が合っているか確認してください。');
  else toast(err.message);
  setSync('error');
  load({ silent: true }); // サーバーの値に合わせ直す
}

async function onReset() {
  if (state.mode === 'daily' && state.layout !== 'v3') return;
  if (pendingTotal > 0) { toast('ほかの操作を送信中です。少し待ってからもう一度押してください。'); return; }
  const label = MODE_LABEL[state.mode];
  if (!window.confirm(label + 'のチェックを全部外します。よろしいですか？\n（在庫などの数字はそのままです）')) return;
  setSync('busy');
  try {
    await request({ action: 'reset', mode: state.mode }, true);
    toast(label + 'のチェックを全部外しました。');
    await load({ rebuild: true });
  } catch (err) {
    onWriteError(err);
  }
}

// ---------- 品目の追加 ----------
let addUse = 'イベント';
function setAddUse(use) {
  addUse = use;
  $('addUse').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.use === use)));
  $('useHint').textContent = USE_HINT[use];
  $('addReorderWrap').hidden = use === 'イベント';
}
function openAdd() {
  if (state.layout !== 'v3') { toast('品目の追加は、シートのメニュー「③ 普段用の列を追加」を実行すると使えます。'); return; }
  const sel = $('addCat');
  sel.textContent = '';
  const cats = categoriesOf(state.items);
  // 2段のカテゴリは大分類ごとにまとめて出す（選んだ値は「大分類／小分類」のまま）
  groupCats(state.items).forEach((g) => {
    if (isTwoLevel(g)) {
      const og = document.createElement('optgroup'); og.label = g.major || '（カテゴリなし）';
      g.cats.forEach((c) => og.append(Object.assign(document.createElement('option'), { value: c, textContent: splitCat(c).minor || g.major })));
      sel.append(og);
    } else {
      g.cats.forEach((c) => sel.append(Object.assign(document.createElement('option'), { value: c, textContent: c || '（カテゴリなし）' })));
    }
  });
  sel.append(Object.assign(document.createElement('option'), { value: '__new__', textContent: '＋ 新しいカテゴリを作る' }));
  // 初期値: 絞り込み中のカテゴリ → 絞り込み中の大分類の最初 → いま見ている画面の最初のカテゴリ
  let preferred = '';
  if (state.cat.startsWith('C:')) preferred = state.cat.slice(2);
  else if (state.cat.startsWith('M:')) preferred = cats.find((c) => splitCat(c).major === state.cat.slice(2)) || '';
  if (!preferred) preferred = categoriesOf(state.items.filter(inMode))[0] || cats[0] || '';
  sel.value = cats.includes(preferred) ? preferred : (cats.length ? cats[0] : '__new__');
  $('addCatNew').hidden = sel.value !== '__new__';
  $('addCatHint').hidden = sel.value !== '__new__';
  $('addCatNew').value = '';
  $('addName').value = '';
  $('addReorder').value = '';
  $('addErr').textContent = '';
  $('addSubmit').disabled = false;
  setAddUse(state.mode === 'daily' ? '普段' : 'イベント');
  $('addPanel').hidden = false;
  setTimeout(() => $('addName').focus(), 50);
}
function closeAdd() { $('addPanel').hidden = true; }

async function submitAdd(e) {
  e.preventDefault();
  const name = $('addName').value.trim();
  let cat = $('addCat').value === '__new__' ? $('addCatNew').value.trim() : $('addCat').value;
  if (cat) {
    const c = splitCat(cat);
    if (!c.major) { $('addErr').textContent = 'カテゴリの「／」の前（大分類）を入力してください。'; return; }
    cat = c.minor ? c.major + '／' + c.minor : c.major; // 半角の「/」や前後の空白をそろえる
  }
  const reorder = addUse === 'イベント' ? null : parseNum($('addReorder').value);
  if (!name) { $('addErr').textContent = '品目名を入力してください。'; return; }
  if (!cat) { $('addErr').textContent = 'カテゴリを選ぶか、新しいカテゴリ名を入力してください。'; return; }
  if (reorder === undefined) { $('addErr').textContent = '発注点は0以上の数字で入力してください（空欄でもよい）。'; return; }
  $('addSubmit').disabled = true;
  $('addErr').textContent = '';
  try {
    const data = await request({ action: 'add', name, cat, use: addUse, reorder: reorder === null ? '' : reorder }, false);
    closeAdd();
    const where = addUse === '両方' ? 'イベントと普段' : addUse;
    toast('「' + name + '」を追加しました（' + where + 'の画面）。');
    await load({ rebuild: true });
    const li = $('list').querySelector('[data-row="' + data.item.row + '"]');
    if (li) {
      li.scrollIntoView({ block: 'center' });
      li.classList.add('flash');
      setTimeout(() => li.classList.remove('flash'), 1600);
    }
  } catch (err) {
    $('addSubmit').disabled = false;
    if (err.kind === 'unauthorized') { onWriteError(err); return; }
    $('addErr').textContent = err.kind === 'network'
      ? '通信できませんでした。追加されたかどうか、一覧で確認してからもう一度お試しください。'
      : err.message;
    if (err.kind === 'network') load({ silent: true });
  }
}

// ---------- イベント ----------
const list = $('list');
list.addEventListener('click', (e) => {
  const li = e.target.closest('.item');
  if (!li) return;
  const it = state.rowMap.get(Number(li.dataset.row));
  if (!it) return;
  if (e.target.closest('.check')) { onToggle(it); return; }
  const step = e.target.closest('.step');
  if (step) onAdjust(it, step.closest('.num').dataset.field, Number(step.dataset.d));
});
list.addEventListener('change', (e) => {
  if (!e.target.classList.contains('numin')) return;
  const li = e.target.closest('.item');
  const it = li && state.rowMap.get(Number(li.dataset.row));
  if (it) onPut(it, e.target.closest('.num').dataset.field, e.target.value);
});
list.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('numin')) e.target.blur(); });
list.addEventListener('focusin', (e) => { if (e.target.classList.contains('numin')) e.target.select(); });

$('tabEvent').addEventListener('click', () => setMode('event'));
$('tabDaily').addEventListener('click', () => setMode('daily'));
$('catSelect').addEventListener('change', (e) => { state.cat = e.target.value; render(true); });
$('todoBtn').addEventListener('click', () => { state.onlyTodo = !state.onlyTodo; render(true); });
$('shortBtn').addEventListener('click', () => { state.onlyShort = !state.onlyShort; render(true); });
let searchTimer = null;
$('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = e.target.value.trim(); render(true); }, 150);
});
$('reloadBtn').addEventListener('click', () => load({ rebuild: true }));
$('retryBtn').addEventListener('click', () => load());
$('resetBtn').addEventListener('click', onReset);
$('addBtn').addEventListener('click', openAdd);
$('addBtn2').addEventListener('click', openAdd);
$('addCancel').addEventListener('click', closeAdd);
$('addPanel').addEventListener('click', (e) => { if (e.target === $('addPanel')) closeAdd(); });
$('addCat').addEventListener('change', (e) => {
  const isNew = e.target.value === '__new__';
  $('addCatNew').hidden = !isNew;
  $('addCatHint').hidden = !isNew;
  if (isNew) $('addCatNew').focus();
});
$('addUse').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setAddUse(b.dataset.use); });
$('addForm').addEventListener('submit', submitAdd);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('addPanel').hidden) closeAdd(); });
$('relogin').addEventListener('click', () => { storageDel(KEY_STORAGE); state.key = ''; showLogin(''); });
$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('keyInput').value.trim();
  if (!v) return;
  state.key = v;
  storageSet(KEY_STORAGE, v);
  load();
});

setInterval(() => {
  if (document.hidden || pendingTotal > 0 || loading || $('mainView').hidden || !$('addPanel').hidden) return;
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('numin')) return; // 入力中は更新しない
  load({ silent: true });
}, POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('mainView').hidden && pendingTotal === 0) load({ silent: true });
});

// 画面側のエラーも原因を残す（何も出ずに止まるのを防ぐ）
window.addEventListener('error', (e) => {
  if ($('mainView').hidden) status('画面でエラーが発生しました。', e.message + '（画面 ' + APP_VERSION + '）', true); else toast('画面でエラーが発生しました: ' + e.message);
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = String(e.reason && (e.reason.message || e.reason));
  if ($('mainView').hidden) status('画面でエラーが発生しました。', msg + '（画面 ' + APP_VERSION + '）', true); else toast('画面でエラーが発生しました: ' + msg);
});

// ---------- 起動 ----------
function boot() {
  // 共有リンク（…/index.html#k=パスワード）で開いたら、パスワードを覚えてアドレスから消す
  const m = location.hash.match(/[#&]k=([^&]*)/);
  if (m) {
    try { state.key = decodeURIComponent(m[1]).trim(); } catch (e) { state.key = ''; }
    if (state.key) storageSet(KEY_STORAGE, state.key);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  if (!state.key) state.key = (storageGet(KEY_STORAGE) || '').trim();
  if (!state.key) { showLogin(''); return; }
  load();
}
// ページを開いたまま共有リンクをもう一度押された場合（アドレスの # 以降だけが変わる）もパスワードを受け取る
window.addEventListener('hashchange', () => { if (/[#&]k=/.test(location.hash)) boot(); });
state.mode = 'daily'; // 開いたときは必ず「普段」から（切り替えた画面は覚えない）
boot();
})();
</script>
</body>
</html>
